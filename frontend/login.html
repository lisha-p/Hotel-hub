<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HotelHub Login</title>
<style>
  /* Basic Reset */
  * { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }

  body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: url('https://images.unsplash.com/photo-1542314831-068cd1dbfeeb') center/cover no-repeat;
    background-size: cover;
    transition: background 0.4s, color 0.4s;
  }

  body.dark-mode {
    background: #111;
    color: #fff;
  }

  /* Controls */
  .controls {
    position: absolute;
    top: 15px;
    left: 15px;
    display: flex;
    gap: 10px;
    z-index: 1000;
  }

  .icon-btn {
    font-size: 22px;
    cursor: pointer;
    user-select: none;
    background: none;
    border: none;
    color: #000;
  }

  body.dark-mode .icon-btn {
    color: #fff;
  }

  .font-btn {
    padding: 3px 8px;
    border-radius: 5px;
    border: 1px solid #ccc;
    cursor: pointer;
    background: #fff;
    color: #000;
  }

  body.dark-mode .font-btn { 
    background: #333; 
    color: #fff; 
    border:1px solid #555; 
  }

  /* Login Card */
  .login-card {
    background: rgba(255,255,255,0.95);
    border-radius: 20px;
    width: 360px;
    padding: 40px 30px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.3);
    text-align: center;
    transform: translateY(-50px);
    opacity: 0;
    animation: slideIn 0.6s forwards;
    transition: background 0.4s, color 0.4s;
  }

  @keyframes slideIn {
    to { transform: translateY(0); opacity:1; }
  }

  body.dark-mode .login-card { 
    background: rgba(30,30,30,0.95); 
  }

  .login-card h2 {
    color: #ff6600;
    margin-bottom: 30px;
    font-size: 28px;
  }

  /* Input group with floating label */
  .input-group {
    position: relative;
    margin-bottom: 25px;
  }

  .input-group input {
    width: 100%;
    padding: 16px 14px;
    border-radius: 12px;
    border: 1px solid #ccc;
    outline: none;
    background: transparent;
    font-size: 16px;
    transition: all 0.3s;
  }

  body.dark-mode .input-group input {
    border: 1px solid #555;
    color: #fff;
  }

  .input-group label {
    position: absolute;
    top: 50%;
    left: 14px;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.95);
    padding: 0 6px;
    color: #888;
    pointer-events: none;
    transition: 0.3s;
  }

  body.dark-mode .input-group label {
    background: rgba(30,30,30,0.95);
    color: #aaa;
  }

  .input-group input:focus + label,
  .input-group input:not(:placeholder-shown) + label {
    top: -10px;
    font-size: 12px;
    color: #ff6600;
  }

  /* Login Button */
  .login-card button {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: none;
    font-size: 16px;
    cursor: pointer;
    background: linear-gradient(90deg, #ff6600, #ff8533);
    color: #fff;
    margin-top: 10px;
    transition: all 0.3s;
  }

  .login-card button:hover { 
    background: linear-gradient(90deg, #e65c00, #ff6600); 
  }

  /* Links */
  .login-card a {
    display: block;
    margin: 12px 0;
    text-decoration: none;
    color: #ff6600;
    font-size: 14px;
  }

  /* Social Login */
  .social-login {
    display: flex;
    justify-content: space-between;
    margin-top: 15px;
    gap: 10px;
  }

  .social-login button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    color: #fff;
    font-size: 14px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    transition: transform 0.2s;
  }

  .social-login button:hover { transform: scale(1.05); }
  .social-login button.google { background: #4285F4; }
  .social-login button.email { background: #ff6600; }

  /* Responsive */
  @media(max-width: 400px) {
    .login-card { width: 90%; padding: 35px 25px; }
  }
</style>
</head>
<body>

<div class="controls">
  <span id="themeToggle" class="icon-btn">🌙</span>
  <button id="decreaseBtn" class="font-btn">A-</button>
  <button id="increaseBtn" class="font-btn">A+</button>
</div>

<div class="login-card">
  <h2>HotelHub Login</h2>

  <div class="input-group">
    <input type="email" id="email" placeholder=" " required>
    <label>Email</label>
  </div>

  <div class="input-group">
    <input type="password" id="password" placeholder=" " required>
    <label>Password</label>
  </div>

  <button id="loginBtn" onclick="login()">Login</button>
  <a href="#">Forgot Password?</a>

  <div class="social-login">
    <button class="google" onclick="alert('Google Login Demo')">Google</button>
    <button class="email" onclick="alert('Email Login Demo')">Email</button>
  </div>

  <a href="#">Create an Account</a>
</div>

<script>
  // DARK MODE & FONT SIZE
  const themeToggle = document.getElementById("themeToggle");
  const dec = document.getElementById("decreaseBtn");
  const inc = document.getElementById("increaseBtn");

  let size = localStorage.getItem("fontSize") ? parseInt(localStorage.getItem("fontSize")) : 16;
  document.body.style.fontSize = size + "px";

  if(localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark-mode");
    themeToggle.textContent = "☀️";
  }

  themeToggle.addEventListener("click", () => {
    document.body.classList.toggle("dark-mode");
    themeToggle.textContent = document.body.classList.contains("dark-mode") ? "☀️" : "🌙";
    localStorage.setItem("theme", document.body.classList.contains("dark-mode") ? "dark" : "light");
  });

  inc.addEventListener("click", () => { if(size<40){size++;document.body.style.fontSize=size+"px";localStorage.setItem("fontSize", size);} });
  dec.addEventListener("click", () => { if(size>10){size--;document.body.style.fontSize=size+"px";localStorage.setItem("fontSize", size);} });

  // LOGIN FUNCTION
  function login() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if(email === "" || password === "") {
      alert("Please fill in all fields.");
      return;
    }

    // Demo credentials
    if(email === "user@example.com" && password === "1234") {
      // Store user session
      const userSession = {
        email: email,
        loginTime: new Date().toLocaleString()
      };
      
      // Save to users list
      let users = JSON.parse(localStorage.getItem("hotelUsers")) || [];
      users.push(userSession);
      localStorage.setItem("hotelUsers", JSON.stringify(users));
      
      alert("Login Successful!");
      window.location.href = "search.html";
    } else {
      alert("Invalid credentials!\nTry email: user@example.com / password: 1234");
    }
  }
</script>

</body>
</html>
