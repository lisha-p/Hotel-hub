# =============================================
# SERVER CONFIGURATION
# =============================================
server.port=${PORT:8080}
server.servlet.context-path=/
spring.application.name=HotelHub

# =============================================
# DATABASE CONFIGURATION (MySQL)
# =============================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotelhub_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA / HIBERNATE CONFIGURATION
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.connection.charSet=utf8
spring.jpa.properties.hibernate.connection.characterEncoding=utf8
spring.jpa.properties.hibernate.connection.useUnicode=true


# =============================================
# LOGGING CONFIGURATION
# =============================================
logging.level.com.hotelhub=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.file.name=logs/hotelhub.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# =============================================
# FILE UPLOAD CONFIGURATION
# =============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# =============================================
# SPRING SECURITY (Basic Configuration)
# =============================================
spring.security.oauth2.client.registration.auto-config=false

# =============================================
# ERROR HANDLING
# =============================================
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=never

# =============================================
# H2 DATABASE CONSOLE (Development Only)
# =============================================
# Uncomment below if you want to use H2 for testing
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console
# spring.datasource.url=jdbc:h2:mem:hotelhub_db
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=password
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# =============================================
# THYMELEAF (If using server-side templates)
# =============================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# =============================================
# ACTUATOR ENDPOINTS (Monitoring)
# =============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# =============================================
# CUSTOM APPLICATION PROPERTIES
# =============================================
app.name=HotelHub
app.version=1.0.0
app.description=Smart Hotel Booking System
app.contact.email=support@hotelhub.com

# OTP Configuration
otp.length=4
otp.expiry.minutes=5
otp.max.attempts=3

# Booking Configuration
booking.max.guests=10
booking.advance.days=365
booking.cancellation.hours=24

# Payment Configuration
payment.currency=USD
payment.timeout.minutes=15

# Chatbot Configuration
chatbot.welcome.message=Hello! I'm your HotelHub assistant. How can I help you today?
chatbot.max.response.time=5000

# Email Configuration (Optional)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Cache Configuration
spring.cache.type=simple
spring.cache.cache-names=hotels,users,bookings
spring.cache.simple.size=1000
spring.cache.simple.time-to-live=600000

# Session Configuration
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
spring.session.store-type=none

# Internationalization
spring.web.locale=en
spring.web.locale-resolver=fixed
spring.messages.basename=messages/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=true

# Profile-specific settings
spring.profiles.active=dev

